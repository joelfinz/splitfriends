# Copy .env.example to .env and fill in your values before `docker compose up -d --build`.
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: splitfriends:latest
    container_name: splitfriends
    restart: unless-stopped
    # Defaults to loopback only; put a reverse proxy or tunnel in front of it.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BIND_PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      DATA_DIR: /data
      APP_NAME: ${APP_NAME:-Fairshare}
      RP_ID: ${RP_ID:-localhost}
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      PUSH_CONTACT: ${PUSH_CONTACT:-mailto:admin@example.com}
    volumes:
      - splitfriends-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  splitfriends-data:
